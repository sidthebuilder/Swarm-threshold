[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-threshold"
version = "0.1.0"
description = "Local-only scripted harness for peer-pressure threshold experiments"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
swarm-threshold = "swarm_threshold.cli:main"

[tool.setuptools.packages.find]
include = ["swarm_threshold*"]
